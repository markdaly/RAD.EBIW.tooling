# Runs tools/smoke.sh on stock Ubuntu runners: the kit must start with tools/floor.sh and answer
# every transaction on a machine that is not the author's Mac. Installs only what docs/INSTALL.md
# tells a new user to install (tmux from apt, uv from its install script).
name: ubuntu-smoke
on:
  push:
    branches: [main]
    paths: ["tools/**", "samples/**", "requirements.txt", ".github/workflows/ubuntu-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prerequisites from docs/INSTALL.md
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tmux
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Smoke test
        run: tools/smoke.sh
      - name: Port 80 with the documented sysctl (docs/INSTALL.md, Ubuntu)
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          FLOOR_SESSION=p80 FLOOR_ENV=/dev/null PANEL_PORT=80,18091 tools/floor.sh panel
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1/howto && break; sleep 1; done
          curl -sf http://127.0.0.1/howto | grep -q "Get started" && echo "PASS  panel serves the bare IP on port 80"
          tmux capture-pane -p -t p80-panel | grep "port(s)"
          tmux kill-session -t p80-panel

  # A bare ubuntu:26.04 image (no runner tooling), non-root user, only the apt packages that
  # docs/INSTALL.md lists plus what a desktop install already has (python3, iproute2).
  # Catches a missing prerequisite that the full runner images would hide.
  minimal-26-04:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 20
    env:
      TERM: xterm-256color
    steps:
      - name: Packages (INSTALL.md list + desktop baseline)
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q git tmux curl ca-certificates python3 iproute2
      - uses: actions/checkout@v4
      - name: Non-root user with uv, as a laptop user would have
        run: |
          useradd -m kit && chown -R kit "$GITHUB_WORKSPACE"
          su kit -c 'curl -LsSf https://astral.sh/uv/install.sh | sh'
      - name: Smoke test as that user
        run: su kit -c "export PATH=/home/kit/.local/bin:\$PATH TERM=$TERM; cd '$GITHUB_WORKSPACE' && tools/smoke.sh"
